<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Logo de MaquillArte">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9D9DC"/>
      <stop offset="1" stop-color="#E7A3B0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8875C"/>
      <stop offset=".5" stop-color="#E9C79F"/>
      <stop offset="1" stop-color="#B8875C"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9E2448"/>
      <stop offset=".55" stop-color="#C8436A"/>
      <stop offset="1" stop-color="#8A1E3E"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="46" fill="url(#bg)"/>
  <circle cx="48" cy="48" r="41" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/>
  <!-- trazo de rubor / pincelada -->
  <path d="M18 66c10-9 26-12 40-8 7 2 13 1 20-4" fill="none" stroke="#C8436A" stroke-opacity=".35" stroke-width="7" stroke-linecap="round"/>
  <!-- labial -->
  <g transform="rotate(-18 48 50)">
    <path d="M40 18 L56 26 L56 44 L40 44 Z" fill="url(#lip)"/>
    <rect x="37" y="43" width="22" height="8" rx="1.5" fill="url(#gold)"/>
    <rect x="35" y="50" width="26" height="28" rx="3" fill="#5B2340"/>
    <rect x="38" y="53" width="3" height="22" rx="1.5" fill="#fff" fill-opacity=".25"/>
  </g>
  <!-- destellos -->
  <path d="M71 20l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff"/>
  <path d="M24 28l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z" fill="#fff" fill-opacity=".9"/>
</svg>
